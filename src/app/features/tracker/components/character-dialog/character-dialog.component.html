<div class="modal-backdrop" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <h3>{{ mode() === 'add' ? 'Add Character to Campaign' : 'Edit Character Details' }}</h3>

    @if (mode() === 'add') {
      <div class="form-group">
        <label for="player-select">Assign to Player</label>
        <select
          id="player-select"
          class="form-select"
          [ngModel]="selectedPlayerId()"
          (ngModelChange)="selectedPlayerId.set($event)"
        >
          <option value="new">+ Create New Player</option>
          @for (player of globalPlayers(); track player.id) {
            <option [value]="player.id?.toString()">{{ player.name }}</option>
          }
        </select>
      </div>

      @if (selectedPlayerId() === 'new') {
        <div class="form-group">
          <label for="new-player-name">New Player Name</label>
          <input
            id="new-player-name"
            type="text"
            placeholder="e.g., Alex"
            [ngModel]="newPlayerName()"
            (ngModelChange)="newPlayerName.set($event)"
          />
        </div>
      }
    }

    <div class="form-group">
      <label for="character-name">Character Name</label>
      <input
        id="character-name"
        type="text"
        placeholder="e.g., Thorin Oakenshield"
        [ngModel]="characterName()"
        (ngModelChange)="characterName.set($event)"
        (keydown.enter)="onSave()"
      />
    </div>

    <div class="checkbox-group">
      <label class="checkbox-label">
        <input
          type="checkbox"
          [ngModel]="isDM()"
          (ngModelChange)="isDM.set($event)"
        />
        Is Dungeon Master (DM)
      </label>
    </div>

    <div class="form-group">
      <label>Pick Theme Color</label>
      <div class="color-picker-grid">
        @for (c of presetColors; track c) {
          <button
            type="button"
            class="color-dot-btn"
            [class.selected]="color() === c"
            [style.background-color]="c"
            (click)="selectColor(c)"
          ></button>
        }
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Cancel
      </button>
      <button
        type="button"
        class="btn btn-primary"
        [disabled]="!characterName().trim() || (mode() === 'add' && selectedPlayerId() === 'new' && !newPlayerName().trim())"
        (click)="onSave()"
      >
        {{ mode() === 'add' ? 'Add Character' : 'Save Changes' }}
      </button>
    </div>
  </div>
</div>
